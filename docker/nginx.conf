daemon off;
worker_processes 1;
pid /run/nginx/nginx.pid;

# `stderr` is a special value understood by nginx; the run script does
# `fdmove -c 2 1` so this lands on the container's stdout.
error_log stderr warn;

events {
    worker_connections 512;
    multi_accept off;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    types_hash_max_size 2048;

    # Not in nginx's bundled mime.types; without it the web app manifest is
    # served as application/octet-stream and "add to home screen" ignores it.
    types {
        application/manifest+json  webmanifest;
    }

    # This is a personal tool, not a CDN. Per-request logging is pure overhead
    # and keeps a disk busy at idle. Set to `/dev/stdout` when debugging.
    access_log off;

    # An unprivileged master cannot write to the compiled-in defaults under
    # /var/lib/nginx, so all scratch space lives in /run/nginx (chowned by the
    # init oneshot).
    client_body_temp_path /run/nginx/client_body;
    proxy_temp_path       /run/nginx/proxy;
    fastcgi_temp_path     /run/nginx/fastcgi;
    uwsgi_temp_path       /run/nginx/uwsgi;
    scgi_temp_path        /run/nginx/scgi;

    sendfile          on;
    tcp_nopush        on;
    tcp_nodelay       on;
    server_tokens     off;
    keepalive_timeout 65;

    # Rendered from MAX_UPLOAD_MIB + 64 MiB of headroom, so an over-sized
    # upload is rejected by the Go handler with a JSON error rather than by
    # nginx with a bare 413. MAX_UPLOAD_MIB=0 renders a bare `0`, which is how
    # nginx spells "no limit" - the Go side skips its reader at 0 too.
    client_max_body_size __CLIENT_MAX_BODY__;
    client_body_timeout  300s;
    send_timeout         300s;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied    any;
    gzip_types      text/plain
                    text/css
                    text/xml
                    text/javascript
                    application/javascript
                    application/json
                    application/xml
                    image/svg+xml;

    # Rendered from ALLOWED_HOSTS and PROXY_ONLY by init-aiofiles, and always
    # present: with neither set it defines $aiofiles_host_blocked as a constant
    # 0. The Go process enforces the same two variables on the API; this map is
    # what extends them to the static frontend, so a name the app refuses does
    # not first hand out a UI that then fails on every call.
    include /etc/nginx/host-guard.conf;

    # Rendered from TRUSTED_PROXIES by init-aiofiles, and always present: with
    # nothing set it trusts loopback only. Defines the $aiofiles_fwd_* variables
    # proxy-headers.conf sets X-Real-IP / X-Forwarded-Proto / X-Forwarded-Host
    # from, so a value an outer proxy already wrote is not overwritten with this
    # hop's own view of the connection.
    include /etc/nginx/forwarded.conf;

    # The three /api locations below share docker/proxy-headers.conf
    # (installed as /etc/nginx/proxy-headers.conf) so their Host /
    # X-Forwarded-* handling cannot drift apart.
    server {
        listen      8000 default_server;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Rewrite phase, so it covers every location below including the
        # frontend and the X-Accel target.
        if ($aiofiles_host_blocked) {
            return 403;
        }

        # ------------------------------------------------------------------
        # Server-Sent Events.
        #
        # Without proxy_buffering off the whole stream sits in nginx's buffer
        # and job progress never reaches the browser. proxy_read_timeout has
        # to outlive a long transcode.
        #
        # Two things carry that "do not buffer" instruction across the next hop
        # out, because this nginx is very often not the last one:
        #
        #   - Chunked framing. Turning it off makes the response to whatever is
        #     in front of us end-of-stream delimited, with no Content-Length and
        #     no Transfer-Encoding, and an outer nginx then holds the whole
        #     stream until EOF - which for SSE is never. The browser's
        #     EventSource sits on a connection that never delivers a byte, never
        #     fires onopen and never fires onerror, so live job updates simply
        #     stop working behind a reverse proxy.
        #
        #   - X-Accel-Buffering: no. The Go handler already sets it, but nginx
        #     *consumes* that header rather than forwarding it, so it has to be
        #     re-emitted here for the next hop to see it. `always` keeps it on
        #     non-2xx responses too.
        # ------------------------------------------------------------------
        location = /api/events {
            proxy_pass http://__INTERNAL_ADDR__;
            include /etc/nginx/proxy-headers.conf;

            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            gzip               off;

            add_header X-Accel-Buffering no always;
        }

        # ------------------------------------------------------------------
        # Uploads.
        #
        # proxy_request_buffering off streams the body straight through to the
        # Go process. With it on, a 4 GiB upload is spooled to disk by nginx
        # and then written a second time by the app.
        # ------------------------------------------------------------------
        location = /api/uploads {
            proxy_pass http://__INTERNAL_ADDR__;
            include /etc/nginx/proxy-headers.conf;

            proxy_request_buffering off;
            proxy_buffering         off;
            proxy_read_timeout      1h;
            proxy_send_timeout      1h;
        }

        # ------------------------------------------------------------------
        # Everything else on the API.
        # ------------------------------------------------------------------
        location /api/ {
            proxy_pass http://__INTERNAL_ADDR__;
            include /etc/nginx/proxy-headers.conf;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ------------------------------------------------------------------
        # X-Accel-Redirect target.
        #
        # GET /api/jobs/{id}/download returns an empty body plus
        #   X-Accel-Redirect: $XACCEL_PREFIX/<file>
        # and nginx streams the finished file off disk with sendfile(), so the
        # Go process never copies gigabytes through userspace.
        #
        # Both the location and the alias are rendered from XACCEL_PREFIX and
        # DOWNLOAD_DIR, the variables the Go process reads, so the two ends
        # cannot drift apart.
        #
        # `internal` is the load-bearing directive: it makes this location
        # reachable only via an internal redirect, never by a client asking
        # for the prefix directly.
        # ------------------------------------------------------------------
        location __XACCEL_PREFIX__/ {
            internal;
            alias __DOWNLOAD_DIR__/;
        }

        # ------------------------------------------------------------------
        # Static assets.
        #
        # /vendor/ is version-pinned at image build time, so it can be cached
        # forever. The app's own HTML/CSS/JS must not be, or an image upgrade
        # leaves users on stale JS talking to a new API.
        # ------------------------------------------------------------------
        location /vendor/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ =404;
        }
    }

    # ----------------------------------------------------------------------
    # Healthcheck listener.
    #
    # HEALTHCHECK asks for this over loopback, which puts an IP in Host - the
    # one thing PROXY_ONLY is there to reject. Bound to 127.0.0.1 so it is
    # reachable from inside the container only, and it serves exactly one path.
    # ----------------------------------------------------------------------
    server {
        listen      127.0.0.1:8001;
        server_name _;

        location = /api/health {
            proxy_pass http://__INTERNAL_ADDR__;
            include /etc/nginx/proxy-headers.conf;
        }

        location / {
            return 404;
        }
    }
}
