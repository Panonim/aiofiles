# Shared upstream headers for every /api/ location.
# Installed into the image as /etc/nginx/proxy-headers.conf.

proxy_http_version 1.1;

# Empty Connection header => keepalive to the Go upstream instead of a new
# TCP connection per request, and no accidental "close" on the SSE stream.
proxy_set_header Connection "";

proxy_set_header Host              $host;

# X-Forwarded-For is the one header that is appended to rather than replaced,
# so a chain in front of us survives on its own.
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

# The other three are single-valued, so writing $scheme / $host / $remote_addr
# unconditionally would erase whatever an outer proxy put there - and this
# nginx is always reached over plain HTTP, so X-Forwarded-Proto would come out
# as "http" for a browser that is on HTTPS. The $aiofiles_fwd_* variables are
# rendered by init-aiofiles from TRUSTED_PROXIES: they pass an outer proxy's
# value through when the peer is one of yours, and fall back to this hop's own
# view when it is not. See /etc/nginx/forwarded.conf in a running container.
proxy_set_header X-Real-IP         $aiofiles_fwd_real_ip;
proxy_set_header X-Forwarded-Proto $aiofiles_fwd_proto;
proxy_set_header X-Forwarded-Host  $aiofiles_fwd_host;
