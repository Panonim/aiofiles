name: Release
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  packages: write

jobs:
  binaries:
    name: Build and attach binaries
    # Only a real release has somewhere to upload to; a manual dispatch run builds the image but skips this job.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Mirrors the platforms the Docker image is built for; there is no
        # bundled yt-dlp/ffmpeg/imagemagick here, so this is the bare Go binary only, for people who already have those tools on PATH.
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOFLAGS: -trimpath
        run: go build -ldflags="-s -w -X aiofiles/internal/version.Value=${{ github.ref_name }}" -o aiofiles ./cmd/server

      - name: Package
        run: |
          tar -czf aiofiles-linux-${{ matrix.goarch }}.tar.gz aiofiles
          sha256sum aiofiles-linux-${{ matrix.goarch }}.tar.gz > aiofiles-linux-${{ matrix.goarch }}.tar.gz.sha256

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aiofiles-linux-${{ matrix.goarch }}.tar.gz
            aiofiles-linux-${{ matrix.goarch }}.tar.gz.sha256

  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Dockerfile cross-compiles the Go binary, but the runtime stage
      # runs `apk add` for the target arch, so arm64 still needs emulation.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name, so an owner/repo with
      # capitals still yields a valid reference.
      - name: Derive tags and OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
          flavor: latest=auto

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use the v2 cache service explicitly. The legacy v1 service can
          # return `not_found` while exporting a layer after the image push has already succeeded.
          cache-from: type=gha,scope=aiofiles,version=2
          cache-to: type=gha,scope=aiofiles,mode=max,version=2,ignore-error=true
